  * { box-sizing: border-box; margin: 0; padding: 0; }

.cc-bar {
font-family: ‘Inter’, -apple-system, BlinkMacSystemFont, sans-serif;
background: #0a1a2e;
color: #fff;
padding: 18px 20px;
border-radius: 10px;
max-width: 1100px;
margin: 0 auto;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
}

.cc-title {
font-size: 11px;
font-weight: 600;
letter-spacing: 0.18em;
text-transform: uppercase;
color: #c9a961;
text-align: center;
margin-bottom: 14px;
}

.cc-title .dot {
display: inline-block;
width: 6px;
height: 6px;
border-radius: 50%;
background: #4ade80;
margin-right: 6px;
vertical-align: middle;
animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
0%, 100% { opacity: 1; }
50% { opacity: 0.4; }
}

.cc-row {
display: grid;
grid-template-columns: repeat(8, 1fr);
gap: 8px;
}

@media (max-width: 900px) {
.cc-row { grid-template-columns: repeat(4, 1fr); }
}

@media (max-width: 480px) {
.cc-row { grid-template-columns: repeat(2, 1fr); }
}

.cc-item {
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
padding: 8px 4px;
}

.cc-icon {
width: 32px;
height: 32px;
margin-bottom: 6px;
color: #c9a961;
stroke: currentColor;
fill: none;
stroke-width: 1.6;
stroke-linecap: round;
stroke-linejoin: round;
}

.cc-label {
font-size: 9px;
font-weight: 600;
letter-spacing: 0.1em;
text-transform: uppercase;
color: #8a9aae;
margin-bottom: 3px;
}

.cc-value {
font-size: 16px;
font-weight: 700;
color: #fff;
line-height: 1.1;
}

.cc-sub {
font-size: 10px;
color: #8a9aae;
margin-top: 2px;
}

/* Wind arrow rotates */
.cc-wind-icon { transition: transform 0.6s ease; }

/* Fish bite footer */
.cc-bite {
margin-top: 14px;
padding-top: 14px;
border-top: 1px solid rgba(255, 255, 255, 0.1);
display: flex;
justify-content: space-between;
align-items: center;
gap: 12px;
flex-wrap: wrap;
}

.cc-bite-left {
display: flex;
align-items: center;
gap: 10px;
}

.cc-bite-icon {
width: 24px;
height: 24px;
color: #c9a961;
stroke: currentColor;
fill: none;
stroke-width: 1.6;
stroke-linecap: round;
stroke-linejoin: round;
}

.cc-bite-text {
font-size: 13px;
}

.cc-bite-text strong {
color: #c9a961;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.05em;
font-size: 11px;
}

.cc-bite-species {
color: #fff;
font-weight: 500;
margin-left: 6px;
}

.cc-rating {
display: flex;
align-items: center;
gap: 8px;
font-size: 10px;
font-weight: 600;
letter-spacing: 0.1em;
text-transform: uppercase;
color: #c9a961;
}

.cc-meter {
width: 50px;
height: 5px;
background: rgba(255, 255, 255, 0.1);
border-radius: 3px;
overflow: hidden;
}

.cc-meter-fill {
height: 100%;
background: linear-gradient(90deg, #c9a961, #d97842);
transition: width 1s ease-out;
}
</style>

</head>

<script>
(function() {
  'use strict';
  const LAT = 41.5237, LON = -70.6717, TIDE_STATION = '8447930';

  function tickClock() {
    const now = new Date();
    document.getElementById('time').textContent = now.toLocaleTimeString('en-US', {
      hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York'
    });
    document.getElementById('date').textContent = now.toLocaleDateString('en-US', {
      month: 'short', day: 'numeric', timeZone: 'America/New_York'
    });
  }
  tickClock();
  setInterval(tickClock, 30000);

  function deg2cardinal(deg) {
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    return dirs[Math.round(deg / 45) % 8];
  }
  function fmtTime(d) {
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' });
  }

  async function loadTides() {
    try {
      const now = new Date();
      const begin = new Date(now.getTime() - 6 * 3600 * 1000);
      const end = new Date(now.getTime() + 30 * 3600 * 1000);
      const fmt = d => d.toISOString().slice(0,10).replace(/-/g,'') + ' ' + d.toISOString().slice(11,16).replace(':','');
      const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=CourtAndCast&begin_date=${fmt(begin)}&end_date=${fmt(end)}&datum=MLLW&station=${TIDE_STATION}&time_zone=lst_ldt&units=english&interval=hilo&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      const future = (data.predictions || []).filter(p => new Date(p.t.replace(' ', 'T')) > now);
      const next = future[0];
      let status = 'Slack';
      if (next) {
        status = next.type === 'H' ? 'Rising' : 'Falling';
        const t = new Date(next.t.replace(' ', 'T'));
        const kind = next.type === 'H' ? 'High' : 'Low';
        document.getElementById('tideNext').textContent = `${kind} ${fmtTime(t)}`;
      }
      document.getElementById('tideStatus').textContent = status;
      return { status, next };
    } catch (e) {
      document.getElementById('tideStatus').textContent = '—';
      return null;
    }
  }

  async function loadWeather() {
    try {
      const wxUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,wind_gusts_10m&temperature_unit=fahrenheit&wind_speed_unit=kn&timezone=America%2FNew_York&daily=sunrise,sunset&forecast_days=1`;
      const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LON}&current=wave_height,wave_period,sea_surface_temperature&length_unit=imperial&timezone=America%2FNew_York`;
      const [wxRes, mRes] = await Promise.all([fetch(wxUrl), fetch(marineUrl)]);
      const wx = await wxRes.json();
      const marine = await mRes.json();

      const wSpeed = wx.current.wind_speed_10m;
      const wDir = wx.current.wind_direction_10m;
      const wGust = wx.current.wind_gusts_10m;
      document.getElementById('windSpeed').textContent = Math.round(wSpeed);
      document.getElementById('windIcon').style.transform = `rotate(${wDir + 180}deg)`;
      document.getElementById('windDir').textContent = `${deg2cardinal(wDir)} · G${Math.round(wGust)}`;

      const wave = marine.current.wave_height;
      const period = marine.current.wave_period;
      document.getElementById('waveHeight').textContent = wave != null ? wave.toFixed(1) : '—';
      document.getElementById('wavePeriod').textContent = period != null ? `${Math.round(period)}s period` : '—';

      document.getElementById('airTemp').textContent = Math.round(wx.current.temperature_2m);
      document.getElementById('airFeels').textContent = `Feels ${Math.round(wx.current.apparent_temperature)}°`;

      const water = marine.current.sea_surface_temperature;
      document.getElementById('waterTemp').textContent = water != null ? Math.round(water) : '—';
      document.getElementById('waterDesc').textContent = water != null ? waterDesc(water) : '—';

      if (wx.daily) {
        document.getElementById('sunrise').textContent = fmtTime(new Date(wx.daily.sunrise[0]));
        document.getElementById('sunset').textContent = fmtTime(new Date(wx.daily.sunset[0]));
      }

      return { wSpeed, wave, water };
    } catch (e) { return null; }
  }

  function waterDesc(t) {
    if (t < 50) return 'Cold';
    if (t < 60) return 'Cool';
    if (t < 68) return 'Warming';
    if (t < 74) return 'Prime';
    return 'Warm';
  }

  function biteReport(c, tide) {
    const month = new Date().getMonth();
    const hour = new Date().getHours();
    let score = 50;

    if (tide?.status === 'Rising' || tide?.status === 'Falling') score += 20;
    if (c?.wSpeed != null) {
      if (c.wSpeed < 5) score -= 5;
      else if (c.wSpeed <= 15) score += 10;
      else if (c.wSpeed <= 20) score -= 5;
      else score -= 20;
    }
    if (c?.wave != null) {
      if (c.wave < 3) score += 5;
      else if (c.wave >= 4) score -= 15;
    }
    if ((hour >= 5 && hour <= 8) || (hour >= 17 && hour <= 20)) score += 10;
    score = Math.max(15, Math.min(95, score));

    // Top target species for Cape Cod by month
    const targets = {
      0: 'Cod', 1: 'Cod', 2: 'Winter Flounder',
      3: 'Squid · Tautog', 4: 'Striped Bass · Squid',
      5: 'Striped Bass · Bluefish', 6: 'Striped Bass · Bluefish · Fluke',
      7: 'Striped Bass · Bluefish · Albies', 8: 'Albies · Bonito · Stripers',
      9: 'Tautog · Stripers · Albies', 10: 'Tautog · Sea Bass', 11: 'Cod'
    };

    let rating = 'Slow';
    if (score >= 80) rating = 'On Fire';
    else if (score >= 65) rating = 'Hot';
    else if (score >= 50) rating = 'Good';
    else if (score >= 35) rating = 'Fair';

    return { score, rating, species: targets[month] };
  }

  async function refresh() {
    const [tide, weather] = await Promise.all([loadTides(), loadWeather()]);
    const r = biteReport(weather, tide);
    document.getElementById('biteSpecies').textContent = r.species;
    document.getElementById('biteRating').textContent = r.rating;
    document.getElementById('biteMeter').style.width = r.score + '%';
  }
  refresh();
  setInterval(refresh, 10 * 60 * 1000);
})();
</script>
