<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court &amp; Cast | Cape Cod's Premier Lifestyle Experience</title>
  <link rel="canonical" href="https://courtandcast.com/">
  <meta name="description" content="Court &amp; Cast offers premium guided fishing charters, golf, and tennis experiences on Cape Cod, MA. Book a personalized outing with a USCG-licensed captain in Falmouth.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Court &amp; Cast | Cape Cod's Premier Lifestyle Experience">
  <meta property="og:description" content="Premium guided fishing charters, golf, and tennis on Cape Cod. USCG-licensed captain. Based in Falmouth, MA.">
  <meta property="og:url" content="https://courtandcast.com/">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:     #0D1F33;
      --navy:    #1B3A5C;
      --teal:    #2A7F7F;
      --teal2:   #3AACAC;
      --gold:    #C8A84B;
      --gold2:   #E5C96A;
      --cream:   #F6F1E9;
      --fog:     #E8EFF2;
      --sand:    #EDE5D8;
      --white:   #FDFAF6;
      --muted:   #7A8A96;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  'Jost', system-ui, sans-serif;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; font-size:16px; }

    body {
      font-family: var(--sans);
      background: var(--white);
      color: var(--ink);
      overflow-x: hidden;
    }

    .container { max-width:1180px; margin:0 auto; padding:0 2.5rem; }
    .eyebrow {
      font-family: var(--sans);
      font-size:.7rem; font-weight:600;
      letter-spacing:.22em; text-transform:uppercase;
      color: var(--gold); display:block; margin-bottom:.9rem;
    }
    .display {
      font-family: var(--serif);
      font-weight:300; line-height:1.07;
      color: var(--navy);
    }
    .display em { font-style:italic; color: var(--teal); }
    .lead {
      font-family: var(--serif);
      font-size:1.2rem; font-weight:300; line-height:1.85;
      color: var(--muted);
    }

    .nav {
      position:fixed; inset:0 0 auto; z-index:200;
      height:74px;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 3rem;
      background:rgba(13,31,51,.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(200,168,75,.18);
      transition: box-shadow .3s;
    }
    .nav.scrolled { box-shadow:0 8px 40px rgba(0,0,0,.35); }

    .nav-brand {
      display:flex; align-items:center; gap:13px; text-decoration:none;
    }
    .nav-brand img {
      width:42px; height:42px; border-radius:4px;
      border:1px solid rgba(200,168,75,.3);
      object-fit:cover;
    }
    .nav-brand-name {
      font-family: var(--serif);
      font-size:1.25rem; font-weight:600;
      color:#fff; letter-spacing:.03em;
    }
    .nav-brand-name span { color: var(--gold); }

    .nav-links {
      display:flex; align-items:center; gap:2.2rem; list-style:none;
    }
    .nav-links a {
      font-size:.72rem; font-weight:500;
      letter-spacing:.12em; text-transform:uppercase;
      color:rgba(255,255,255,.65); text-decoration:none;
      transition:color .2s;
    }
    .nav-links a:hover { color: var(--gold2); }
    .nav-cta {
      background: var(--gold) !important;
      color: var(--ink) !important;
      padding:.55rem 1.4rem !important;
      border-radius:2px; font-weight:600 !important;
      transition:background .2s !important;
    }
    .nav-cta:hover { background: var(--gold2) !important; }
  </style>
</head>
<body>
<nav class="nav" id="nav">
  <a href="#home" class="nav-brand">
    <img src="logo.jpg" alt="Court &amp; Cast logo" width="42" height="42">
    <span class="nav-brand-name">Court <span>&amp;</span> Cast</span>
  </a>
  <ul class="nav-links">
    <li><a href="#water">On the Water</a></li>
    <li><a href="tennis">Tennis</a></li>
    <li><a href="#golf">Golf</a></li>
    <li><a href="#membership">Memberships</a></li>
    <li><a href="/gift">Gift Cape Cod</a></li>
    <li><a href="/about">About</a></li>
    <li><a href="#contact" class="nav-cta">Book a Consultation</a></li>
  </ul>
</nav>

</body>
</html>
