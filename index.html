<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court & Cast | Cape Cod's Premier Lifestyle Experience</title>
  <link rel="canonical" href="https://courtandcast.com/">
  <meta name="description" content="Court & Cast offers premium guided fishing charters, golf, and tennis experiences on Cape Cod, MA. Book a personalized outing with a USCG-licensed captain in Falmouth.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Court & Cast | Cape Cod's Premier Lifestyle Experience">
  <meta property="og:description" content="Premium guided fishing charters, golf, and tennis on Cape Cod. USCG-licensed captain. Based in Falmouth, MA.">
  <meta property="og:url" content="https://courtandcast.com/">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:     #0D1F33;
      --navy:    #1B3A5C;
      --teal:    #2A7F7F;
      --teal2:   #3AACAC;
      --gold:    #C8A84B;
      --gold2:   #E5C96A;
      --cream:   #F6F1E9;
      --fog:     #E8EFF2;
      --sand:    #EDE5D8;
      --white:   #FDFAF6;
      --muted:   #7A8A96;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  'Jost', system-ui, sans-serif;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; font-size:16px; }

    body {
      font-family: var(--sans);
      background: var(--white);
      color: var(--ink);
      overflow-x: hidden;
    }

    /* ─── UTILITY ─── */
    .container { max-width:1180px; margin:0 auto; padding:0 2.5rem; }
    .eyebrow {
      font-family: var(--sans);
      font-size:.7rem; font-weight:600;
      letter-spacing:.22em; text-transform:uppercase;
      color: var(--gold); display:block; margin-bottom:.9rem;
    }
    .display {
      font-family: var(--serif);
      font-weight:300; line-height:1.07;
      color: var(--navy);
    }
    .display em { font-style:italic; color: var(--teal); }
    .lead {
      font-family: var(--serif);
      font-size:1.2rem; font-weight:300; line-height:1.85;
      color: var(--muted);
    }

    /* ─── NAVIGATION ─── */
    .nav {
      position:fixed; inset:0 0 auto; z-index:200;
      height:74px;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 3rem;
      background:rgba(13,31,51,.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(200,168,75,.18);
      transition: box-shadow .3s;
    }
    .nav.scrolled { box-shadow:0 8px 40px rgba(0,0,0,.35); }

    .nav-brand {
      display:flex; align-items:center; gap:13px; text-decoration:none;
    }
    .nav-brand img {
      width:42px; height:42px; border-radius:4px;
      border:1px solid rgba(200,168,75,.3);
      object-fit:cover;
    }
    .nav-brand-name {
      font-family: var(--serif);
      font-size:1.25rem; font-weight:600;
      color:#fff; letter-spacing:.03em;
    }
    .nav-brand-name span { color: var(--gold); }

    .nav-links {
      display:flex; align-items:center; gap:2.2rem; list-style:none;
    }
    .nav-links a {
      font-size:.72rem; font-weight:500;
      letter-spacing:.12em; text-transform:uppercase;
      color:rgba(255,255,255,.65); text-decoration:none;
      transition:color .2s;
    }
    .nav-links a:hover { color: var(--gold2); }
    .nav-cta {
      background: var(--gold) !important;
      color: var(--ink) !important;
      padding:.55rem 1.4rem !important;
      border-radius:2px; font-weight:600 !important;
      transition:background .2s !important;
    }
    .nav-cta:hover { background: var(--gold2) !important; }

    /* ─── HAMBURGER TOGGLE ─── */
    .nav-toggle {
      display:none;
      flex-direction:column;
      justify-content:center;
      gap:5px;
      cursor:pointer;
      background:none;
      border:none;
      padding:8px;
      z-index:201;
    }
    .nav-toggle span {
      display:block;
      width:24px; height:2px;
      background:rgba(255,255,255,.85);
      border-radius:2px;
      transition:all .25s;
    }
    .nav-toggle.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity:0; }
    .nav-toggle.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

    /* ─── HERO ─── */
    .hero {
      min-height:100vh;
      background: var(--ink);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center;
      padding:100px 2rem 0;
      position:relative; overflow:hidden;
    }

    /* layered atmosphere */
    .hero-bg {
      position:absolute; inset:0;
      background:
        radial-gradient(ellipse 90% 55% at 15% 90%, rgba(42,127,127,.22) 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 85% 15%, rgba(27,58,92,.55) 0%, transparent 55%),
        linear-gradient(175deg, #0b1a2a 0%, #0D1F33 60%, #122840 100%);
    }

    /* thin diagonal rule */
    .hero-bg::after {
      content:'';
      position:absolute;
      inset:0;
      background: repeating-linear-gradient(
        -55deg,
        transparent,
        transparent 80px,
        rgba(255,255,255,.012) 80px,
        rgba(255,255,255,.012) 81px
      );
    }

    /* bottom fade to white */
    .hero-fade {
      position:absolute; bottom:0; left:0; right:0;
      height:220px;
      background:linear-gradient(to top, var(--white) 0%, transparent 100%);
      z-index:3;
    }

    .hero-content {
      position:relative; z-index:4;
      max-width:860px;
      padding-bottom:140px;
    }

    .hero-logo {
      width:118px; height:118px;
      border-radius:10px;
      border:1.5px solid rgba(200,168,75,.45);
      box-shadow: 0 0 80px rgba(42,127,127,.25), 0 24px 70px rgba(0,0,0,.45);
      margin-bottom:2rem;
      animation: rise .9s cubic-bezier(.22,1,.36,1) both;
    }

    .hero-eyebrow {
      font-size:.68rem; font-weight:600;
      letter-spacing:.24em; text-transform:uppercase;
      color: var(--gold); margin-bottom:1.4rem; display:block;
      animation: rise .9s .12s cubic-bezier(.22,1,.36,1) both;
    }

    .hero-headline {
      font-family: var(--serif);
      font-size:clamp(3.2rem, 7.5vw, 6rem);
      font-weight:300; line-height:1.04; color:#fff;
      margin-bottom:1.4rem;
      animation: rise .9s .22s cubic-bezier(.22,1,.36,1) both;
    }
    .hero-headline em { font-style:italic; color: var(--teal2); }

    .hero-sub {
      font-family: var(--serif);
      font-size:clamp(1.1rem, 2.2vw, 1.45rem);
      font-weight:300; font-style:italic;
      color:rgba(255,255,255,.62); line-height:1.75;
      margin-bottom:3rem;
      animation: rise .9s .32s cubic-bezier(.22,1,.36,1) both;
    }

    /* pill row */
    .hero-pills {
      display:flex; flex-wrap:wrap; gap:.75rem;
      justify-content:center; margin-bottom:2.8rem;
      animation: rise .9s .42s cubic-bezier(.22,1,.36,1) both;
    }
    .pill {
      display:flex; align-items:center; gap:.5rem;
      border:1px solid rgba(200,168,75,.35);
      border-radius:100px; padding:.4rem 1rem;
      font-size:.72rem; font-weight:500;
      letter-spacing:.07em; text-transform:uppercase;
      color:rgba(255,255,255,.78);
      background:rgba(255,255,255,.04);
    }
    .pill-dot { width:5px; height:5px; border-radius:50%; background:var(--gold); flex-shrink:0; }

    .hero-cta {
      display:inline-block;
      background: var(--gold); color: var(--ink);
      padding:1.1rem 3rem; border-radius:2px;
      font-size:.82rem; font-weight:600;
      letter-spacing:.13em; text-transform:uppercase;
      text-decoration:none;
      box-shadow:0 6px 30px rgba(200,168,75,.4);
      transition:all .25s;
      animation: rise .9s .52s cubic-bezier(.22,1,.36,1) both;
    }
    .hero-cta:hover {
      background: var(--gold2);
      transform:translateY(-3px);
      box-shadow:0 12px 40px rgba(200,168,75,.5);
    }
    .hero-cta-wrap { display:flex; align-items:center; gap:2rem; flex-wrap:wrap; margin-top:0; }
    .hero-gift-link {
      display:inline-flex; align-items:center; gap:.5rem;
      color: var(--gold);
      font-family: var(--sans);
      font-size:.75rem;
      font-weight:500;
      letter-spacing:.13em;
      text-transform:uppercase;
      text-decoration:none;
      border-bottom:1px solid rgba(200,168,75,.4);
      padding-bottom:2px;
      transition:all .25s;
      animation: rise .9s .68s cubic-bezier(.22,1,.36,1) both;
    }
    .hero-gift-link:hover {
      border-bottom-color:var(--gold);
      color:var(--gold2);
    }

    @keyframes rise {
      from { opacity:0; transform:translateY(32px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ─── FOUR PILLARS ─── */
    .pillars { padding:7rem 0; background: var(--white); }

    .pillars-head {
      text-align:center; margin-bottom:5rem;
    }
    .pillars-head .display { font-size:clamp(2.4rem,5vw,3.8rem); }

    .pillars-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:0;
    }

    .pillar {
      position:relative; overflow:hidden;
      padding:3.5rem 2.2rem 3rem;
      border-right:1px solid rgba(27,58,92,.08);
      cursor:default;
      transition:background .35s;
    }
    .pillar:last-child { border-right:none; }
    .pillar:hover { background:var(--cream); }

    .pillar-num {
      font-family: var(--serif);
      font-size:4.5rem; font-weight:300;
      color:rgba(27,58,92,.07);
      line-height:1; margin-bottom:.5rem;
      transition:color .35s;
    }
    .pillar:hover .pillar-num { color:rgba(200,168,75,.18); }

    .pillar-icon { font-size:2rem; margin-bottom:1.2rem; display:block; }

    .pillar-name {
      font-family: var(--serif);
      font-size:1.55rem; font-weight:600;
      color: var(--navy); margin-bottom:.75rem; line-height:1.2;
    }

    .pillar-desc {
      font-size:.88rem; color: var(--muted);
      line-height:1.75; margin-bottom:1.4rem;
    }

    .pillar-price {
      font-size:.72rem; font-weight:600;
      letter-spacing:.1em; text-transform:uppercase;
      color: var(--teal);
    }

    .pillar-bar {
      position:absolute; bottom:0; left:0; right:0;
      height:3px; background: var(--gold);
      transform:scaleX(0); transform-origin:left;
      transition:transform .4s cubic-bezier(.22,1,.36,1);
    }
    .pillar:hover .pillar-bar { transform:scaleX(1); }

    /* ─── MARQUEE STRIP ─── */
    .marquee-strip {
      background: var(--navy);
      padding:1rem 0;
      overflow:hidden;
      border-top:1px solid rgba(200,168,75,.2);
      border-bottom:1px solid rgba(200,168,75,.2);
    }
    .marquee-track {
      display:flex; gap:3rem;
      animation:scroll-left 25s linear infinite;
      width:max-content;
    }
    .marquee-item {
      font-size:.72rem; font-weight:500;
      letter-spacing:.18em; text-transform:uppercase;
      color:rgba(255,255,255,.55);
      white-space:nowrap;
      display:flex; align-items:center; gap:1.5rem;
    }
    .marquee-item::after {
      content:'✦';
      color: var(--gold); opacity:.6; font-size:.6rem;
    }
    @keyframes scroll-left {
      from { transform:translateX(0); }
      to   { transform:translateX(-50%); }
    }

    /* ─── ON THE WATER (CAPTAIN) ─── */
    .water {
      padding:9rem 0;
      background:var(--ink);
      position:relative; overflow:hidden;
    }
    .water::before {
      content:'';
      position:absolute; inset:0;
      background:
        radial-gradient(ellipse 80% 60% at 85% 60%, rgba(42,127,127,.16) 0%, transparent 55%),
        radial-gradient(ellipse 50% 70% at 10% 30%, rgba(27,58,92,.5) 0%, transparent 50%);
    }

    .water-inner {
      position:relative; z-index:1;
      display:grid; grid-template-columns:1fr 1fr; gap:7rem; align-items:center;
    }

    .water .eyebrow { color: var(--teal2); }
    .water .display { color:#fff; font-size:clamp(2.2rem,4.5vw,3.5rem); }
    .water .lead { color:rgba(255,255,255,.55); font-size:1.05rem; margin-top:1.4rem; }

    .uscg-badge {
      margin-top:2.5rem;
      display:inline-flex; align-items:center; gap:1rem;
      background:rgba(200,168,75,.1);
      border:1px solid rgba(200,168,75,.35);
      border-radius:4px;
      padding:1.1rem 1.6rem;
    }
    .uscg-badge-icon { font-size:2rem; }
    .uscg-badge-text-title {
      font-family: var(--serif);
      font-size:1rem; font-weight:600;
      color: var(--gold); display:block;
    }
    .uscg-badge-text-sub {
      font-size:.78rem; color:rgba(255,255,255,.55);
    }

    .excursions { display:flex; flex-direction:column; gap:.9rem; }

    .exc {
      display:grid; grid-template-columns:auto 1fr auto;
      align-items:center; gap:1.2rem;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.07);
      border-radius:4px;
      padding:1.1rem 1.4rem;
      transition:all .25s;
    }
    .exc:hover {
      background:rgba(42,127,127,.15);
      border-color:rgba(42,127,127,.4);
      transform:translateX(4px);
    }
    .exc-icon { font-size:1.4rem; }
    .exc-name { font-size:.95rem; font-weight:500; color:#fff; }
    .exc-detail { font-size:.77rem; color:rgba(255,255,255,.42); margin-top:.2rem; }
    .exc-price { font-family: var(--serif); font-size:1.1rem; color: var(--gold); font-weight:600; white-space:nowrap; }

    /* ─── TENNIS ─── */
    .tennis {
      padding:9rem 0;
      background:var(--sand);
    }

    .tennis-inner {
      display:grid; grid-template-columns:1fr 1fr; gap:7rem; align-items:start;
    }

    .tennis .display { font-size:clamp(2.2rem,4.5vw,3.5rem); }
    .golf .display { font-size:clamp(2.2rem,4.5vw,3.5rem); }
    .tennis .lead { margin-top:1.4rem; }

    .tennis-quote {
      margin-top:2.5rem;
      padding-left:1.5rem;
      border-left:3px solid var(--gold);
      font-family: var(--serif);
      font-size:1.3rem; font-style:italic; font-weight:300;
      color: var(--navy); line-height:1.7;
    }

    .t-cards { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }

    .t-card {
      background:#fff; border-radius:4px;
      padding:1.6rem 1.4rem;
      border-bottom:3px solid var(--teal);
      box-shadow:0 4px 24px rgba(27,58,92,.07);
      transition:transform .25s;
    }
    .t-card:hover { transform:translateY(-4px); }
    .t-card-label {
      font-size:.68rem; font-weight:600;
      letter-spacing:.12em; text-transform:uppercase;
      color: var(--muted); margin-bottom:.4rem;
    }
    .t-card-price {
      font-family: var(--serif);
      font-size:1.6rem; font-weight:600; color: var(--teal);
    }
    .t-card-note { font-size:.78rem; color: var(--muted); margin-top:.3rem; }

    .t-note {
      font-size:.82rem; color: var(--muted);
      font-style:italic; margin-top:1.2rem; line-height:1.6;
    }

    /* ─── GOLF ─── */
    .golf {
      padding:9rem 0;
      background:var(--fog);
    }

    .golf-inner {
      display:grid; grid-template-columns:1fr 1fr; gap:7rem; align-items:center;
    }

    .golf-table { width:100%; border-collapse:collapse; }
    .golf-table th {
      text-align:left; font-size:.68rem;
      letter-spacing:.12em; text-transform:uppercase;
      color: var(--muted); font-weight:600;
      padding:.6rem .8rem .6rem 0;
      border-bottom:1px solid rgba(27,58,92,.1);
    }
    .golf-table td {
      padding:.85rem .8rem .85rem 0;
      border-bottom:1px solid rgba(27,58,92,.06);
      font-size:.92rem;
    }
    .golf-table td:first-child { color: var(--navy); font-weight:500; }
    .golf-table td:last-child {
      font-family: var(--serif);
      font-size:1.1rem; color: var(--teal); font-weight:600;
      text-align:right;
    }
    .golf-table tr:hover td { background:rgba(200,168,75,.04); }

    /* ─── MEMBERSHIP ─── */
    .membership { padding:9rem 0; background:var(--white); }

    .membership-head { text-align:center; margin-bottom:5rem; }
    .membership-head .display { font-size:clamp(2.4rem,5vw,3.8rem); }
    .membership-head .lead { max-width:560px; margin:.8rem auto 0; text-align:center; }

    .tiers {
      display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem;
    }

    .tier {
      background:var(--cream); border-radius:6px;
      padding:2.8rem 2.2rem;
      border:1px solid rgba(27,58,92,.08);
      transition:all .3s;
      position:relative; overflow:hidden;
    }
    .tier:hover { box-shadow:0 24px 60px rgba(27,58,92,.1); transform:translateY(-4px); }

    .tier.star {
      background: var(--navy); border-color:transparent;
      box-shadow:0 30px 80px rgba(27,58,92,.22);
      transform:translateY(-10px);
    }
    .tier.star:hover { transform:translateY(-14px); }

    .tier-eyebrow {
      font-size:.68rem; font-weight:600;
      letter-spacing:.15em; text-transform:uppercase;
      color: var(--gold); display:block; margin-bottom:1rem;
    }

    .tier-name {
      font-family: var(--serif);
      font-size:1.8rem; font-weight:600;
      color: var(--navy); margin-bottom:.4rem;
    }
    .tier.star .tier-name { color:#fff; }

    .tier-price {
      font-family: var(--serif);
      font-size:2.2rem; font-weight:300; color: var(--teal);
    }
    .tier.star .tier-price { color: var(--gold2); }

    .tier-mo {
      font-size:.8rem; color: var(--muted); margin-bottom:2rem;
    }
    .tier.star .tier-mo { color:rgba(255,255,255,.5); }

    .tier-line { height:1px; background:rgba(27,58,92,.1); margin-bottom:1.8rem; }
    .tier.star .tier-line { background:rgba(255,255,255,.12); }

    .tier-list { list-style:none; display:flex; flex-direction:column; gap:.75rem; }
    .tier-list li {
      display:flex; gap:.7rem; align-items:flex-start;
      font-size:.875rem; color: var(--muted); line-height:1.5;
    }
    .tier.star .tier-list li { color:rgba(255,255,255,.7); }
    .tier-check { color: var(--teal); flex-shrink:0; font-weight:700; }
    .tier.star .tier-check { color: var(--gold); }

    /* ─── CTA STRIP ─── */
    .cta-strip {
      padding:8rem 0;
      background: var(--navy);
      text-align:center;
      position:relative; overflow:hidden;
    }
    .cta-strip::before {
      content:'';
      position:absolute; inset:0;
      background:radial-gradient(ellipse 60% 80% at 50% 50%, rgba(42,127,127,.18) 0%, transparent 60%);
    }
    .cta-strip-inner { position:relative; z-index:1; max-width:700px; margin:0 auto; }
    .cta-strip .eyebrow { text-align:center; }
    .cta-strip .display { font-size:clamp(2.5rem,5.5vw,4rem); color:#fff; margin-bottom:1.2rem; }
    .cta-strip .lead { color:rgba(255,255,255,.55); margin-bottom:2.5rem; text-align:center; }
    .cta-big {
      display:inline-block;
      background: var(--gold); color: var(--ink);
      padding:1.25rem 3.5rem; border-radius:2px;
      font-size:.85rem; font-weight:600;
      letter-spacing:.15em; text-transform:uppercase;
      text-decoration:none;
      box-shadow:0 8px 40px rgba(200,168,75,.4);
      transition:all .25s;
    }
    .cta-big:hover { background: var(--gold2); transform:translateY(-3px); box-shadow:0 16px 50px rgba(200,168,75,.5); }
    .cta-note { font-size:.8rem; color:rgba(255,255,255,.35); margin-top:1.2rem; }

    /* ─── CONTACT ─── */
    .contact { padding:9rem 0; background: var(--cream); }

    .contact-inner {
      display:grid; grid-template-columns:1fr 1.3fr; gap:6rem; align-items:start;
    }

    .contact .display { font-size:clamp(2.2rem,4vw,3.2rem); }
    .contact .lead { margin-top:1.2rem; }

    .contact-detail { margin-top:2.5rem; display:flex; flex-direction:column; gap:1rem; }
    .c-item {
      display:flex; align-items:center; gap:.9rem;
      font-size:.9rem; color: var(--navy);
    }
    .c-icon {
      width:36px; height:36px; border-radius:50%;
      background: var(--navy);
      display:flex; align-items:center; justify-content:center;
      font-size:.95rem; flex-shrink:0;
    }

    .form-card {
      background:#fff; border-radius:6px;
      padding:3rem 2.5rem;
      box-shadow:0 20px 60px rgba(27,58,92,.1);
    }
