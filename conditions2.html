<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Court & Cast — Live Cape Cod Conditions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #0a1a2e;
    --navy: #142845;
    --navy-light: #1d3a5f;
    --gold: #c9a961;
    --gold-bright: #e0bd6e;
    --foam: #e8eef5;
    --mist: #a8b8c8;
    --tide-line: #4a9eb8;
    --hot: #d97842;
    --warm: #c9a961;
    --cool: #6b8caf;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

.cc-widget {
font-family: ‘Fraunces’, Georgia, serif;
background: linear-gradient(165deg, var(–navy-deep) 0%, var(–navy) 50%, var(–navy-light) 100%);
color: var(–foam);
border-radius: 14px;
padding: 28px;
max-width: 980px;
margin: 0 auto;
position: relative;
overflow: hidden;
box-shadow: 0 20px 60px rgba(10, 26, 46, 0.4);
}

/* Subtle wave texture overlay */
.cc-widget::before {
content: ‘’;
position: absolute;
inset: 0;
background-image:
radial-gradient(circle at 20% 30%, rgba(74, 158, 184, 0.08) 0%, transparent 50%),
radial-gradient(circle at 80% 70%, rgba(201, 169, 97, 0.06) 0%, transparent 50%);
pointer-events: none;
}

.cc-widget > * { position: relative; z-index: 1; }

.cc-header {
display: flex;
justify-content: space-between;
align-items: flex-end;
border-bottom: 1px solid rgba(201, 169, 97, 0.25);
padding-bottom: 18px;
margin-bottom: 24px;
flex-wrap: wrap;
gap: 12px;
}

.cc-brand {
font-family: ‘Fraunces’, serif;
font-weight: 800;
font-size: 26px;
letter-spacing: -0.02em;
color: var(–foam);
}

.cc-brand .amp {
color: var(–gold);
font-style: italic;
font-weight: 400;
}

.cc-location {
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
text-transform: uppercase;
letter-spacing: 0.15em;
color: var(–mist);
}

.cc-location .live-dot {
display: inline-block;
width: 7px;
height: 7px;
border-radius: 50%;
background: #4ade80;
margin-right: 6px;
animation: pulse 2s ease-in-out infinite;
vertical-align: middle;
}

@keyframes pulse {
0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
}

.cc-time-tide {
display: grid;
grid-template-columns: 1fr 1.4fr;
gap: 24px;
margin-bottom: 24px;
}

@media (max-width: 640px) {
.cc-time-tide { grid-template-columns: 1fr; }
}

.cc-time-block {
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(201, 169, 97, 0.15);
border-radius: 10px;
padding: 20px;
}

.cc-clock {
font-family: ‘Fraunces’, serif;
font-size: 42px;
font-weight: 600;
letter-spacing: -0.02em;
line-height: 1;
color: var(–foam);
}

.cc-date {
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
text-transform: uppercase;
letter-spacing: 0.15em;
color: var(–mist);
margin-top: 8px;
}

.cc-sun {
margin-top: 14px;
padding-top: 14px;
border-top: 1px solid rgba(255, 255, 255, 0.08);
font-family: ‘JetBrains Mono’, monospace;
font-size: 12px;
color: var(–mist);
display: flex;
justify-content: space-between;
}

.cc-sun span:first-child::before { content: ’↑ ’; color: var(–gold); }
.cc-sun span:last-child::before { content: ’↓ ’; color: var(–hot); }

.cc-tide-block {
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(201, 169, 97, 0.15);
border-radius: 10px;
padding: 20px;
position: relative;
}

.cc-label {
font-family: ‘JetBrains Mono’, monospace;
font-size: 10px;
text-transform: uppercase;
letter-spacing: 0.2em;
color: var(–gold);
margin-bottom: 10px;
}

.cc-tide-status {
font-family: ‘Fraunces’, serif;
font-size: 22px;
font-weight: 600;
font-style: italic;
margin-bottom: 4px;
}

.cc-tide-next {
font-family: ‘JetBrains Mono’, monospace;
font-size: 12px;
color: var(–mist);
margin-bottom: 12px;
}

.cc-tide-chart {
height: 60px;
width: 100%;
margin-top: 8px;
}

.cc-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
gap: 12px;
margin-bottom: 24px;
}

.cc-card {
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(201, 169, 97, 0.15);
border-radius: 10px;
padding: 16px;
transition: transform 0.2s, border-color 0.2s;
}

.cc-card:hover {
transform: translateY(-2px);
border-color: rgba(201, 169, 97, 0.4);
}

.cc-card-value {
font-family: ‘Fraunces’, serif;
font-size: 28px;
font-weight: 600;
line-height: 1;
color: var(–foam);
margin-top: 6px;
}

.cc-card-unit {
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
color: var(–mist);
margin-left: 4px;
}

.cc-card-sub {
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
color: var(–mist);
margin-top: 6px;
}

.cc-wind-arrow {
display: inline-block;
margin-left: 6px;
color: var(–gold);
font-size: 18px;
transition: transform 0.5s ease;
}

/* Fish report — the centerpiece */
.cc-bite {
background: linear-gradient(135deg, rgba(201, 169, 97, 0.12) 0%, rgba(217, 120, 66, 0.08) 100%);
border: 1px solid rgba(201, 169, 97, 0.35);
border-radius: 10px;
padding: 22px;
position: relative;
overflow: hidden;
}

.cc-bite::before {
content: ‘’;
position: absolute;
top: -20px;
right: -20px;
width: 120px;
height: 120px;
background: radial-gradient(circle, rgba(217, 120, 66, 0.15) 0%, transparent 70%);
pointer-events: none;
}

.cc-bite-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 14px;
flex-wrap: wrap;
gap: 8px;
}

.cc-bite-title {
font-family: ‘Fraunces’, serif;
font-weight: 800;
font-size: 20px;
letter-spacing: -0.01em;
}

.cc-bite-meter {
display: flex;
align-items: center;
gap: 8px;
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
text-transform: uppercase;
letter-spacing: 0.15em;
color: var(–gold-bright);
}

.cc-meter-bar {
width: 60px;
height: 6px;
background: rgba(255, 255, 255, 0.1);
border-radius: 3px;
overflow: hidden;
}

.cc-meter-fill {
height: 100%;
background: linear-gradient(90deg, var(–gold) 0%, var(–hot) 100%);
border-radius: 3px;
transition: width 1s ease-out;
}

.cc-species-list {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
gap: 10px;
margin-top: 10px;
}

.cc-species {
background: rgba(10, 26, 46, 0.4);
border-left: 3px solid var(–gold);
padding: 10px 12px;
border-radius: 4px;
}

.cc-species-name {
font-family: ‘Fraunces’, serif;
font-weight: 600;
font-size: 14px;
color: var(–foam);
}

.cc-species-tip {
font-family: ‘JetBrains Mono’, monospace;
font-size: 10px;
color: var(–mist);
margin-top: 3px;
line-height: 1.4;
}

.cc-species.hot { border-left-color: var(–hot); }
.cc-species.warm { border-left-color: var(–warm); }
.cc-species.cool { border-left-color: var(–cool); }

.cc-footer {
margin-top: 22px;
padding-top: 16px;
border-top: 1px solid rgba(255, 255, 255, 0.06);
display: flex;
justify-content: space-between;
align-items: center;
font-family: ‘JetBrains Mono’, monospace;
font-size: 10px;
color: var(–mist);
letter-spacing: 0.1em;
text-transform: uppercase;
flex-wrap: wrap;
gap: 8px;
}

.cc-footer .tagline {
font-family: ‘Fraunces’, serif;
font-style: italic;
font-size: 13px;
text-transform: none;
letter-spacing: 0;
color: var(–gold-bright);
}

.cc-loading {
opacity: 0.4;
font-style: italic;
}

.cc-error {
color: var(–hot);
font-size: 11px;
margin-top: 4px;
}
</style>

</head>

<script>
(function() {
  'use strict';

  // Falmouth / Woods Hole coordinates
  const LAT = 41.5237;
  const LON = -70.6717;
  const TIDE_STATION = '8447930'; // Woods Hole, MA

  // ---------- CLOCK ----------
  function tickClock() {
    const now = new Date();
    const opts = { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' };
    const dateOpts = { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'America/New_York' };
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', opts);
    document.getElementById('dateStr').textContent = now.toLocaleDateString('en-US', dateOpts);
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---------- HELPERS ----------
  function cToF(c) { return c * 9/5 + 32; }
  function msToKt(ms) { return ms * 1.94384; }
  function mToFt(m) { return m * 3.28084; }
  function deg2cardinal(deg) {
    const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(deg / 22.5) % 16];
  }
  function fmtTime(d) {
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' });
  }

  // ---------- TIDES (NOAA CO-OPS) ----------
  async function loadTides() {
    try {
      const now = new Date();
      const begin = new Date(now.getTime() - 6 * 3600 * 1000);
      const end = new Date(now.getTime() + 24 * 3600 * 1000);
      const fmt = d => d.toISOString().slice(0,10).replace(/-/g,'') + ' ' + d.toISOString().slice(11,16).replace(':','');

      // Predictions for high/low
      const hiloUrl = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=CourtAndCast&begin_date=${fmt(begin)}&end_date=${fmt(end)}&datum=MLLW&station=${TIDE_STATION}&time_zone=lst_ldt&units=english&interval=hilo&format=json`;
      // 6-min predictions for chart
      const chartUrl = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=CourtAndCast&begin_date=${fmt(begin)}&end_date=${fmt(end)}&datum=MLLW&station=${TIDE_STATION}&time_zone=lst_ldt&units=english&interval=h&format=json`;

      const [hiloRes, chartRes] = await Promise.all([fetch(hiloUrl), fetch(chartUrl)]);
      const hilo = await hiloRes.json();
      const chart = await chartRes.json();

      // Find next tide event
      const future = (hilo.predictions || []).filter(p => new Date(p.t.replace(' ', 'T')) > now);
      const past = (hilo.predictions || []).filter(p => new Date(p.t.replace(' ', 'T')) <= now);
      const lastEvent = past[past.length - 1];
      const nextEvent = future[0];

      let status = 'Slack';
      if (lastEvent && nextEvent) {
        if (nextEvent.type === 'H') status = 'Flooding ↑';
        else if (nextEvent.type === 'L') status = 'Ebbing ↓';
      }
      document.getElementById('tideStatus').textContent = status;

      if (nextEvent) {
        const t = new Date(nextEvent.t.replace(' ', 'T'));
        const kind = nextEvent.type === 'H' ? 'High' : 'Low';
        document.getElementById('tideNext').textContent =
          `Next ${kind} · ${fmtTime(t)} · ${parseFloat(nextEvent.v).toFixed(1)} ft`;
      }

      // Draw chart
      drawTideChart(chart.predictions || [], now);

      return { status, lastEvent, nextEvent };
    } catch (e) {
      document.getElementById('tideStatus').textContent = 'Data unavailable';
      console.error('Tides:', e);
      return null;
    }
  }

  function drawTideChart(points, now) {
    const svg = document.getElementById('tideChart');
    if (!points.length) return;
    const vals = points.map(p => parseFloat(p.v));
    const times = points.map(p => new Date(p.t.replace(' ', 'T')));
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min || 1;
    const w = 400, h = 60, pad = 4;

    const pts = points.map((p, i) => {
      const x = (i / (points.length - 1)) * w;
      const y = h - pad - ((parseFloat(p.v) - min) / range) * (h - 2 * pad);
      return [x, y];
    });

    // Smooth path
    let d = `M ${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x, y] = pts[i];
      const [px, py] = pts[i-1];
      const cx = (px + x) / 2;
      d += ` Q ${cx} ${py} ${x} ${y}`;
    }

    // Position of "now"
    const nowMs = now.getTime();
    const startMs = times[0].getTime();
    const endMs = times[times.length - 1].getTime();
    const nowX = ((nowMs - startMs) / (endMs - startMs)) * w;

    svg.innerHTML = `
      <defs>
        <linearGradient id="tideGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4a9eb8" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#4a9eb8" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="url(#tideGrad)"/>
      <path d="${d}" fill="none" stroke="#4a9eb8" stroke-width="1.5"/>
      <line x1="${nowX}" y1="0" x2="${nowX}" y2="${h}" stroke="#c9a961" stroke-width="1.5" stroke-dasharray="2,2"/>
      <circle cx="${nowX}" cy="${h/2}" r="3" fill="#e0bd6e"/>
    `;
  }

  // ---------- WEATHER + MARINE (Open-Meteo) ----------
  async function loadWeather() {
    try {
      const wxUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,wind_gusts_10m&temperature_unit=fahrenheit&wind_speed_unit=kn&timezone=America%2FNew_York&daily=sunrise,sunset&forecast_days=1`;
      const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LON}&current=wave_height,wave_period,wave_direction,sea_surface_temperature&length_unit=imperial&timezone=America%2FNew_York`;

      const [wxRes, mRes] = await Promise.all([fetch(wxUrl), fetch(marineUrl)]);
      const wx = await wxRes.json();
      const marine = await mRes.json();

      // Wind
      const wSpeed = wx.current.wind_speed_10m;
      const wDir = wx.current.wind_direction_10m;
      const wGust = wx.current.wind_gusts_10m;
      document.getElementById('windSpeed').textContent = Math.round(wSpeed);
      document.getElementById('windArrow').style.transform = `rotate(${wDir + 180}deg)`;
      document.getElementById('windDir').textContent = `From ${deg2cardinal(wDir)} · Gusts ${Math.round(wGust)} kt`;

      // Waves
      const wave = marine.current.wave_height;
      const period = marine.current.wave_period;
      document.getElementById('waveHeight').textContent = wave != null ? wave.toFixed(1) : '—';
      document.getElementById('wavePeriod').textContent = period != null ? `Period ${period.toFixed(0)}s · ${deg2cardinal(marine.current.wave_direction || 0)}` : '—';

      // Temps
      const air = wx.current.temperature_2m;
      const feels = wx.current.apparent_temperature;
      document.getElementById('airTemp').textContent = Math.round(air);
      document.getElementById('airFeels').textContent = `Feels ${Math.round(feels)}°F`;

      const water = marine.current.sea_surface_temperature;
      document.getElementById('waterTemp').textContent = water != null ? Math.round(water) : '—';
      document.getElementById('waterTrend').textContent = water != null ? waterDescription(water) : '—';

      // Sun
      if (wx.daily) {
        const sr = new Date(wx.daily.sunrise[0]);
        const ss = new Date(wx.daily.sunset[0]);
        document.getElementById('sunrise').textContent = `Sunrise ${fmtTime(sr)}`;
        document.getElementById('sunset').textContent = `Sunset ${fmtTime(ss)}`;
      }

      return { wSpeed, wDir, wGust, wave, period, air, water };
    } catch (e) {
      console.error('Weather:', e);
      return null;
    }
  }

  function waterDescription(t) {
    if (t < 45) return 'Frigid — deep winter';
    if (t < 55) return 'Cold — early spring';
    if (t < 62) return 'Cool — spring run';
    if (t < 68) return 'Warming — prime spring';
    if (t < 72) return 'Comfortable — summer';
    if (t < 76) return 'Warm — peak summer';
    return 'Very warm — late summer';
  }

  // ---------- FISH BITE LOGIC ----------
  // Cape Cod (Falmouth / Vineyard Sound / Buzzards Bay) seasonal patterns
  function computeBiteReport(conditions, tide) {
    const month = new Date().getMonth(); // 0-11
    const hour = new Date().getHours();
    const water = conditions?.water;
    const wind = conditions?.wSpeed;
    const wave = conditions?.wave;

    // Score baseline
    let score = 50;
    let factors = [];

    // Tide is king — moving water beats slack
    const tideStatus = tide?.status || '';
    if (tideStatus.includes('Flooding') || tideStatus.includes('Ebbing')) {
      score += 20;
      factors.push('moving tide');
    } else {
      score -= 5;
    }

    // Wind: light-to-moderate is ideal; heavy is dangerous and shuts down bite
    if (wind != null) {
      if (wind < 5) { score -= 5; factors.push('light air'); }
      else if (wind <= 15) { score += 10; factors.push('workable wind'); }
      else if (wind <= 20) { score -= 5; factors.push('breezy'); }
      else { score -= 20; factors.push('small craft conditions'); }
    }

    // Wave height: <3ft is fishable from most boats
    if (wave != null) {
      if (wave < 2) score += 5;
      else if (wave < 3) score += 0;
      else if (wave < 4) score -= 10;
      else score -= 20;
    }

    // Dawn / dusk bonus
    if ((hour >= 5 && hour <= 8) || (hour >= 17 && hour <= 20)) {
      score += 10;
      factors.push('low-light window');
    }

    score = Math.max(10, Math.min(95, score));

    // Species selection by month + water temp
    let species = seasonalSpecies(month, water);

    // Rating label
    let rating = 'Slow';
    if (score >= 80) rating = 'On Fire';
    else if (score >= 65) rating = 'Hot';
    else if (score >= 50) rating = 'Good';
    else if (score >= 35) rating = 'Fair';

    return { score, rating, species, factors };
  }

  function seasonalSpecies(month, waterTemp) {
    // Cape Cod / Vineyard Sound / Buzzards Bay species calendar
    // month: 0=Jan ... 11=Dec
    const all = [];

    // Striped Bass — May through October peak
    if (month >= 4 && month <= 10) {
      let tip = 'Live eels or chunk bait near rocky structure';
      let tier = 'warm';
      if (month >= 5 && month <= 8) { tier = 'hot'; tip = 'Topwater at dawn · live eels after dark'; }
      if (waterTemp != null && waterTemp > 72) tip = 'Fish deeper · early/late only — water is warm';
      all.push({ name: 'Striped Bass', tip, tier });
    }

    // Bluefish — June through October
    if (month >= 5 && month <= 10) {
      all.push({ name: 'Bluefish', tip: 'Wire leaders · poppers and metal in blitzes', tier: month >= 6 && month <= 8 ? 'hot' : 'warm' });
    }

    // Scup (Porgy) — May through October
    if (month >= 4 && month <= 10) {
      all.push({ name: 'Scup', tip: 'Squid strips on bottom rigs · 20–40 ft', tier: 'warm' });
    }

    // Black Sea Bass — May through November
    if (month >= 4 && month <= 10) {
      all.push({ name: 'Black Sea Bass', tip: 'Jigs over hard bottom and wrecks · 40–80 ft', tier: 'warm' });
    }

    // Fluke (Summer Flounder) — May through September
    if (month >= 4 && month <= 8) {
      all.push({ name: 'Fluke', tip: 'Drift sandy bottom with bucktail + squid strip', tier: 'warm' });
    }

    // False Albacore / Bonito — Aug through October
    if (month >= 7 && month <= 9) {
      all.push({ name: 'False Albacore', tip: 'Epoxy jigs and small metals into busting fish', tier: 'hot' });
    }

    // Tautog — spring + fall (peak Oct-Nov)
    if (month === 3 || month === 4 || (month >= 8 && month <= 10)) {
      all.push({ name: 'Tautog', tip: 'Green crab on jig heads · structure and rockpiles', tier: month >= 9 ? 'hot' : 'warm' });
    }

    // Winter Flounder — March/April
    if (month >= 2 && month <= 4) {
      all.push({ name: 'Winter Flounder', tip: 'Sea worms on bottom · muddy harbors and bays', tier: 'cool' });
    }

    // Cod — winter through early spring offshore
    if (month <= 3 || month === 11) {
      all.push({ name: 'Cod', tip: 'Jigs and bait over offshore structure', tier: 'cool' });
    }

    // Squid — spring jigging
    if (month >= 3 && month <= 5) {
      all.push({ name: 'Squid', tip: 'Glow jigs under lights · evening tides', tier: 'cool' });
    }

    // Fallback for deep winter
    if (all.length === 0) {
      all.push({ name: 'Off Season', tip: 'Tie flies · clean reels · plan the spring run', tier: 'cool' });
    }

    return all.slice(0, 6);
  }

  function renderBite(report) {
    document.getElementById('biteRating').textContent = report.rating;
    document.getElementById('biteMeter').style.width = report.score + '%';

    const list = document.getElementById('speciesList');
    list.innerHTML = report.species.map(s => `
      <div class="cc-species ${s.tier}">
        <div class="cc-species-name">${s.name}</div>
        <div class="cc-species-tip">${s.tip}</div>
      </div>
    `).join('');
  }

  // ---------- ORCHESTRATE ----------
  async function refresh() {
    const [tide, weather] = await Promise.all([loadTides(), loadWeather()]);
    const report = computeBiteReport(weather, tide);
    renderBite(report);

    const updated = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' });
    document.getElementById('lastUpdate').innerHTML = `<span class="live-dot"></span>Updated ${updated}`;
  }

  refresh();
  // Refresh every 10 minutes
  setInterval(refresh, 10 * 60 * 1000);
})();
</script>
