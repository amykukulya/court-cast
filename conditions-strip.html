<!-- =================================================================
     COURT & CAST — LIVE CONDITIONS HEADER STRIP
     Drop this ENTIRE block at the top of your <body> on index.html
     (right after <body>, before your existing content)
     ================================================================= -->

<style>
  .cc-strip {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(90deg, #0a1a2e 0%, #142845 100%);
    color: #e8eef5;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 13px;
    border-bottom: 2px solid #c9a961;
    box-sizing: border-box;
  }
  .cc-strip * { box-sizing: border-box; }

  .cc-strip-brand {
    font-weight: 700;
    color: #c9a961;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-right: 16px;
    border-right: 1px solid rgba(201, 169, 97, 0.3);
  }

  .cc-strip-live {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    margin-right: 6px;
    vertical-align: middle;
    animation: cc-pulse 2s ease-in-out infinite;
  }
  @keyframes cc-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .cc-strip-item {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .cc-strip-icon {
    width: 16px; height: 16px;
    color: #c9a961;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .cc-strip-label {
    color: #8a9aae;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .cc-strip-value {
    color: #fff;
    font-weight: 600;
  }

  .cc-strip-bite {
    background: rgba(201, 169, 97, 0.15);
    border: 1px solid rgba(201, 169, 97, 0.4);
    padding: 4px 10px;
    border-radius: 12px;
    color: #e0bd6e;
    font-weight: 600;
    font-size: 12px;
  }

  .cc-wind-icon { transition: transform 0.6s ease; }

  @media (max-width: 768px) {
    .cc-strip { gap: 14px; padding: 8px 12px; font-size: 12px; }
    .cc-strip-brand { display: none; }
  }
</style>

<div class="cc-strip" id="ccStrip">
  <div class="cc-strip-brand"><span class="cc-strip-live"></span>Live · Falmouth</div>

  <div class="cc-strip-item" title="Tide">
    <svg class="cc-strip-icon" viewBox="0 0 24 24">
      <path d="M2 14c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/>
      <path d="M2 19c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2"/>
    </svg>
    <span class="cc-strip-label">Tide</span>
    <span class="cc-strip-value" id="ccTide">—</span>
  </div>

  <div class="cc-strip-item" title="Wind">
    <svg class="cc-strip-icon cc-wind-icon" id="ccWindIcon" viewBox="0 0 24 24">
      <path d="M12 2l4 6h-3v12h-2V8H8l4-6z"/>
    </svg>
    <span class="cc-strip-label">Wind</span>
    <span class="cc-strip-value"><span id="ccWind">—</span> kt <span id="ccWindDir" style="color:#8a9aae;font-weight:400;">—</span></span>
  </div>

  <div class="cc-strip-item" title="Wave Height">
    <svg class="cc-strip-icon" viewBox="0 0 24 24">
      <path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>
      <path d="M2 18c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/>
    </svg>
    <span class="cc-strip-label">Waves</span>
    <span class="cc-strip-value"><span id="ccWave">—</span> ft</span>
  </div>

  <div class="cc-strip-item" title="Air Temperature">
    <svg class="cc-strip-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.5"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>
    </svg>
    <span class="cc-strip-label">Air</span>
    <span class="cc-strip-value"><span id="ccAir">—</span>°F</span>
  </div>

  <div class="cc-strip-item" title="Water Temperature — Woods Hole">
    <svg class="cc-strip-icon" viewBox="0 0 24 24">
      <path d="M12 3c-3 4-5 7-5 10a5 5 0 0010 0c0-3-2-6-5-10z"/>
    </svg>
    <span class="cc-strip-label">Water</span>
    <span class="cc-strip-value"><span id="ccWater">—</span>°F</span>
  </div>

  <div class="cc-strip-bite" id="ccBite">Hot Bite: —</div>
</div>

<script>
(function() {
  'use strict';
  var LAT = 41.5237, LON = -70.6717, STATION = '8447930';

  function deg2cardinal(deg) {
    var dirs = ['N','NE','E','SE','S','SW','W','NW'];
    return dirs[Math.round(deg / 45) % 8];
  }

  async function loadTide() {
    try {
      var now = new Date();
      var begin = new Date(now.getTime() - 6 * 3600 * 1000);
      var end = new Date(now.getTime() + 24 * 3600 * 1000);
      var fmt = function(d) { return d.toISOString().slice(0,10).replace(/-/g,'') + ' ' + d.toISOString().slice(11,16).replace(':',''); };
      var url = 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=CourtAndCast&begin_date=' + fmt(begin) + '&end_date=' + fmt(end) + '&datum=MLLW&station=' + STATION + '&time_zone=lst_ldt&units=english&interval=hilo&format=json';
      var res = await fetch(url);
      var data = await res.json();
      var future = (data.predictions || []).filter(function(p) { return new Date(p.t.replace(' ', 'T')) > now; });
      var next = future[0];
      if (next) {
        var t = new Date(next.t.replace(' ', 'T'));
        var kind = next.type === 'H' ? 'High' : 'Low';
        var timeStr = t.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' });
        document.getElementById('ccTide').textContent = kind + ' ' + timeStr;
        return { status: next.type === 'H' ? 'Rising' : 'Falling' };
      }
    } catch (e) {
      document.getElementById('ccTide').textContent = 'offline';
    }
    return null;
  }

  async function loadWater() {
    try {
      var url = 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=water_temperature&application=CourtAndCast&date=latest&station=' + STATION + '&time_zone=lst_ldt&units=english&format=json';
      var res = await fetch(url);
      var data = await res.json();
      if (data.data && data.data.length) {
        var temp = parseFloat(data.data[data.data.length - 1].v);
        document.getElementById('ccWater').textContent = Math.round(temp);
        return temp;
      }
    } catch (e) {}
    return null;
  }

  async function loadWeather() {
    try {
      var wxUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON + '&current=temperature_2m,wind_speed_10m,wind_direction_10m&temperature_unit=fahrenheit&wind_speed_unit=kn&timezone=America%2FNew_York';
      var marineUrl = 'https://marine-api.open-meteo.com/v1/marine?latitude=' + LAT + '&longitude=' + LON + '&current=wave_height&length_unit=imperial&timezone=America%2FNew_York';
      var wxRes = await fetch(wxUrl);
      var mRes = await fetch(marineUrl);
      var wx = await wxRes.json();
      var marine = mRes.ok ? await mRes.json() : { current: {} };

      var wSpeed = wx.current.wind_speed_10m;
      var wDir = wx.current.wind_direction_10m;
      document.getElementById('ccWind').textContent = Math.round(wSpeed);
      document.getElementById('ccWindDir').textContent = deg2cardinal(wDir);
      document.getElementById('ccWindIcon').style.transform = 'rotate(' + (wDir + 180) + 'deg)';

      var wave = marine.current && marine.current.wave_height;
      document.getElementById('ccWave').textContent = wave != null ? wave.toFixed(1) : '—';

      document.getElementById('ccAir').textContent = Math.round(wx.current.temperature_2m);

      return { wSpeed: wSpeed, wave: wave };
    } catch (e) { return null; }
  }

  function biteToday(c, tide) {
    var month = new Date().getMonth();
    var hour = new Date().getHours();
    var score = 50;
    if (tide && (tide.status === 'Rising' || tide.status === 'Falling')) score += 20;
    if (c && c.wSpeed != null) {
      if (c.wSpeed >= 5 && c.wSpeed <= 15) score += 10;
      else if (c.wSpeed > 20) score -= 20;
    }
    if (c && c.wave != null && c.wave >= 4) score -= 15;
    if ((hour >= 5 && hour <= 8) || (hour >= 17 && hour <= 20)) score += 10;

    var targets = {
      0:'Cod', 1:'Cod', 2:'Winter Flounder', 3:'Squid/Tautog', 4:'Striped Bass',
      5:'Stripers/Blues', 6:'Stripers/Blues/Fluke', 7:'Stripers/Blues/Albies',
      8:'Albies/Bonito', 9:'Tautog/Stripers', 10:'Tautog/Sea Bass', 11:'Cod'
    };
    var label = 'Slow';
    if (score >= 80) label = '🔥 On Fire';
    else if (score >= 65) label = '🔥 Hot';
    else if (score >= 50) label = 'Good';
    else if (score >= 35) label = 'Fair';
    return label + ': ' + targets[month];
  }

  async function refresh() {
    var results = await Promise.all([loadTide(), loadWeather(), loadWater()]);
    var tide = results[0], weather = results[1];
    document.getElementById('ccBite').textContent = biteToday(weather, tide);
  }
  refresh();
  setInterval(refresh, 10 * 60 * 1000);
})();
</script>
